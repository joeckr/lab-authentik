apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab-authentik.fullname" . }}-server
  labels:
    {{- include "lab-authentik.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.ports.https }}
      targetPort: https
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "lab-authentik.serverSelectorLabels" . | nindent 4 }}
