{{- if not .Values.authentik.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lab-authentik.secretName" . }}
  labels:
    {{- include "lab-authentik.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: {{ .Values.authentik.secretKey | quote }}
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ include "lab-authentik.postgresPassword" . | quote }}
  {{- if .Values.authentik.bootstrap.password }}
  AUTHENTIK_BOOTSTRAP_PASSWORD: {{ .Values.authentik.bootstrap.password | quote }}
  {{- end }}
  {{- if .Values.authentik.bootstrap.email }}
  AUTHENTIK_BOOTSTRAP_EMAIL: {{ .Values.authentik.bootstrap.email | quote }}
  {{- end }}
  {{- if .Values.authentik.bootstrap.token }}
  AUTHENTIK_BOOTSTRAP_TOKEN: {{ .Values.authentik.bootstrap.token | quote }}
  {{- end }}
{{- end }}
