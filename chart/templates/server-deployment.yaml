apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lab-authentik.fullname" . }}-server
  labels:
    {{- include "lab-authentik.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "lab-authentik.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-authentik.labels" . | nindent 8 }}
        {{- include "lab-authentik.serverSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.authentik.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.authentik.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authentik.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authentik.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authentik.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: media
          {{- if .Values.persistence.media.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lab-authentik.fullname" . }}-media
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: server
          image: "{{ .Values.authentik.image.repository }}:{{ .Values.authentik.image.tag }}"
          imagePullPolicy: {{ .Values.authentik.image.pullPolicy }}
          args:
            - server
          {{- with .Values.authentik.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.ports.http }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.server.ports.https }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.server.ports.metrics }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "lab-authentik.fullname" . }}-config
            - secretRef:
                name: {{ include "lab-authentik.secretName" . }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: media
              mountPath: /media
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
